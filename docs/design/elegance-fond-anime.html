<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elegance — Fond animé</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#000d1d;overflow:hidden}

  /* ===== LE FOND ANIMÉ (à garder) ===== */
  #elegance-bg{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;
               background:radial-gradient(120% 80% at 60% 45%,#00122a 0%,#000d1d 60%,#000a17 100%)}

  /* ===== Démo de l'écran (facultatif) ===== */
  .ui{position:relative;z-index:1;height:100%;max-width:440px;margin:0 auto;padding:0 32px;box-sizing:border-box;
      display:flex;flex-direction:column;color:#f4ece0;font-family:Montserrat,sans-serif}
  .top{display:flex;justify-content:space-between;align-items:center;padding-top:30px}
  .brand{letter-spacing:.35em;font-size:14px;font-weight:600;display:flex;align-items:center;gap:16px}
  .brand i{width:9px;height:9px;border:2px solid #e8b878;border-radius:50%}
  .logo{text-align:center;margin-top:8vh}
  .logo h1{margin:0;font-weight:600;letter-spacing:.08em;font-size:clamp(38px,11vw,54px);text-shadow:0 0 18px rgba(255,240,220,.35)}
  .logo p{margin:6px 0 0;letter-spacing:.6em;font-size:12px;font-weight:500}
  .title{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(46px,13vw,64px);line-height:1.02;text-align:center;margin:7vh 0 0}
  .sub{text-align:center;font-size:15px;margin-top:20px}
  .btn{display:flex;justify-content:center;align-items:center;gap:18px;height:52px;margin-top:36px;letter-spacing:.3em;font-weight:600;font-size:15px;text-decoration:none}
  .btn.primary{background:linear-gradient(180deg,#f7ead6,#e9d7bc);color:#0b1220}
  .btn.ghost{margin-top:18px;border:1px solid rgba(244,236,224,.8);color:#f4ece0}
  .tags{margin-top:auto;padding-bottom:6vh;display:flex;justify-content:space-between;text-align:center;font-size:11px;letter-spacing:.2em;line-height:1.7}
</style>
</head>
<body>

<canvas id="elegance-bg" aria-hidden="true"></canvas>

<div class="ui">
  <div class="top"><div class="brand"><i></i>ELEGANCE</div>
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#f4ece0" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/><circle cx="16" cy="15" r=".8" fill="#f4ece0"/></svg>
  </div>
  <div class="logo"><h1>ELEGANCE</h1><p>STRASBOURG</p></div>
  <h2 class="title">Bien plus<br>qu’une coupe.</h2>
  <div class="sub">Coiffure homme et barbe · Schiltigheim</div>
  <a class="btn primary" href="#">RÉSERVER <span>→</span></a>
  <a class="btn ghost" href="#">APPELER</a>
  <div class="tags"><div>COUPE<br>HOMME</div><div>TAILLE<br>DE BARBE</div><div>SUR<br>RENDEZ-VOUS</div></div>
</div>

<script>
/* =========================================================================
   ELEGANCE — Fond animé "éclipse bleue" (WebGL)
   La forme est relevée pixel par pixel sur l'image d'origine :
   une ellipse inclinée de 43°, dont deux portions s'illuminent.
   Chaque pixel calcule sa distance à la courbe -> halo parfaitement lisse.
   Intégration : <canvas id="elegance-bg"></canvas> + ce script.
   ========================================================================= */
(function () {
  const CFG = {
    speed: 1.0,      // vitesse globale de l'animation
    motion: 1.0,     // 0 = image fixe identique à l'original, 1 = normal, 0.5 = plus discret, 1.3 = encore plus marqué
    glow: 1.0,       // intensité du halo
    breathPeriod: 7, // durée d'une respiration complète (secondes) : inspiration + expiration
    breathMin: 0.0,  // halo au point le plus bas : 0 = disparaît totalement, 0.3 = reste un peu visible
    coreMin: 0.12,   // le fin trait de l'arc au plus bas (0 = disparaît aussi)
    maxDPR: 1.75     // qualité (densité de pixels max) — baisser pour économiser la batterie
  };
  const params = new URLSearchParams(location.search);
  if (params.has('static')) CFG.motion = 0;
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const canvas = document.getElementById('elegance-bg');
  const gl = canvas.getContext('webgl', { antialias: false, alpha: false, premultipliedAlpha: false });
  if (!gl) return; // le dégradé CSS du canvas sert de repli

  const VS = `attribute vec2 p; void main(){ gl_Position = vec4(p,0.,1.); }`;

  const FS = `
  precision highp float;
  uniform vec2  uRes;      // taille en pixels écran
  uniform float uScale;    // pixels écran par unité de design
  uniform vec2  uOffset;   // position de l'origine du design à l'écran
  uniform float uTime;
  uniform float uMotion;
  uniform float uGlow;
  uniform float uBreathPeriod, uBreathMin, uCoreMin;

  // Ellipse relevée sur l'image d'origine (repère 863 x 1822)
  const vec2  C0  = vec2(571.53, 862.64);
  const float TH0 = -0.75136;              // -43.05°
  const vec2  R0  = vec2(907.69, 485.15);

  float hash(vec2 p){ p = fract(p*vec2(443.897,441.423)); p += dot(p, p.yx+19.19); return fract((p.x+p.y)*p.x); }
  float vnoise(vec2 p){
    vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
    return mix(mix(hash(i),hash(i+vec2(1,0)),f.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x), f.y);
  }
  float band(float x, float a0, float a1, float b0, float b1){
    return smoothstep(a0,a1,x) * (1.0 - smoothstep(b0,b1,x));
  }

  // Profil lumineux autour de la courbe (dd > 0 = côté du grand halo)
  // wf : largeur du halo (se resserre vers les extrémités, comme sur l'image)
  void profile(float d, float dd, float wf, out float core, out float halo){
    float ad = abs(d);
    core = exp(-ad/1.3) + 0.25*exp(-ad/3.5);
    halo = dd > 0.0
      ? 1.05*exp(-dd/(15.0*wf)) + 0.60*exp(-dd/(50.0*wf)) + 0.10*exp(-dd/(160.0*wf))
      : 0.85*exp(-ad/(5.0*wf))  + 0.24*exp(-ad/(22.0*wf)) + 0.06*exp(-ad/(110.0*wf));
  }

  void main(){
    vec2 fc = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y);
    vec2 p  = (fc - uOffset) / uScale;              // coordonnées "design"
    float t = uTime, m = uMotion;

    // Ellipse animée : légère rotation, respiration et dérive
    float th = TH0 + m*0.055*sin(t*0.16);
    vec2  r  = R0 * (1.0 + m*0.018*sin(t*0.27 + 1.3));
    vec2  c  = C0 + m*vec2(16.0*sin(t*0.13), 14.0*cos(t*0.11));
    vec2 dp = p - c;
    float cs = cos(th), sn = sin(th);
    vec2 q = vec2(dp.x*cs + dp.y*sn, -dp.x*sn + dp.y*cs);
    float k0 = length(q/r), k1 = length(q/(r*r));
    float d  = k0*(k0-1.0)/k1;                      // distance signée (+ = extérieur)
    float ang = degrees(atan(q.y/r.y, q.x/r.x));    // position le long de l'ellipse

    // Fenêtres éclairées (mêmes positions que l'image) qui ondulent lentement
    float s1 = m*11.0*sin(t*0.21), s2 = m*9.0*sin(t*0.18 + 2.0);
    float wTop = band(ang, -119.0+s1, -92.0+s1, -34.0+s2, -6.0+s2);
    float wBot = band(ang,   66.0-s2,  90.0-s2, 112.0+s1, 143.0+s1);

    // Variation d'intensité le long de l'arc + éclat qui voyage
    float along = 0.72 + 0.28*sin(radians(ang)*6.0 - t*0.9*m);
    along = mix(1.0, along, m);
    float pTop = mix(0.0, -130.0, fract(t*0.075));
    float pBot = mix(148.0, 60.0, fract(t*0.065 + 0.45));
    float spTop = 1.0 + m*0.9*exp(-pow((ang-pTop)/11.0, 2.0));
    float spBot = 1.0 + m*0.9*exp(-pow((ang-pBot)/10.0, 2.0));
    // Respiration : le halo apparaît et s'étend (inspiration), puis s'éteint (expiration)
    float ph = fract(t / uBreathPeriod);
    float br = 0.5 - 0.5*cos(6.2831853*ph);
    br = br*br*(3.0 - 2.0*br);                         // douceur aux extrêmes
    br = mix(1.0, br, step(0.001, m));
    float haloAmp = mix(uBreathMin, 1.0, br);
    float coreAmp = mix(uCoreMin, 1.0, smoothstep(0.0, 0.8, br));
    float wb = mix(1.0, 0.65 + 0.45*br, step(0.001, m));   // le halo s'élargit en inspirant

    float cT, hT, cB, hB;
    profile(d,  d, (0.45 + 0.55*wTop)*wb, cT, hT);   // arc du haut : halo vers l'extérieur
    profile(d, -d, (0.45 + 0.55*wBot)*wb, cB, hB);   // arc du bas  : halo vers l'intérieur

    // Fines stries de lumière dans le halo (comme sur l'image)
    float streak = vnoise(vec2(ang*3.5 + t*0.6*m, d*0.015 - t*0.12*m));
    streak = mix(0.93 + 0.14*streak, 0.78 + 0.44*streak, m);

    float wT = wTop*spTop, wB = wBot*spBot;
    float core = (cT*wT*wT + cB*wB*wB) * along * coreAmp;
    float halo = (hT*wT + 1.35*hB*wB) * along * haloAmp * streak * uGlow;

    // Couleurs mesurées sur l'original : fond #000D1D, halo bleu, coeur cyan
    vec3 bg = vec3(0.0, 13.0, 30.0)/255.0;
    vec2 uv = fc/uRes;
    bg *= 1.0 - 0.25*pow(length((uv - vec2(0.55,0.5))*vec2(1.0,0.9)), 2.0);
    bg += vec3(0.0, 0.006, 0.016) * smoothstep(250.0, 0.0, -d) * 0.6;   // légère lueur interne

    vec3 light = halo * vec3(0.0, 0.50, 1.25) * 1.15
               + core * vec3(0.05, 1.25, 1.6);
    vec3 col = bg + (1.0 - bg) * (1.0 - exp(-light));

    // Dithering + grain (évite le "banding" des dégradés)
    float g = hash(fc + fract(t*7.13)*vec2(97.0,57.0)) - 0.5;
    col += g * (1.6/255.0) + g * 0.012 * m;

    gl_FragColor = vec4(col, 1.0);
  }`;

  function sh(type, src){ const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s)); return s; }
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog); gl.useProgram(prog);
  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'p');
  gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const U = n => gl.getUniformLocation(prog, n);
  const uRes = U('uRes'), uScale = U('uScale'), uOffset = U('uOffset'), uTime = U('uTime'), uMotion = U('uMotion'), uGlow = U('uGlow'), uBP = U('uBreathPeriod'), uBM = U('uBreathMin'), uCM = U('uCoreMin');

  const DW = 863, DH = 1822;
  const sm = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t*t*(3-2*t); };

  function resize(){
    const dpr = Math.min(window.devicePixelRatio || 1, CFG.maxDPR);
    const W = canvas.clientWidth, H = canvas.clientHeight;
    canvas.width = Math.round(W*dpr); canvas.height = Math.round(H*dpr);
    gl.viewport(0, 0, canvas.width, canvas.height);
    // Téléphone : cadrage identique à l'image. Écran large : l'éclipse est centrée.
    const k = sm(0.62, 1.15, W/H);
    const sCover = Math.max(W/DW, H/DH), sWide = H/1480;
    const s = sCover + (sWide - sCover)*k;
    const ax = 431.5 + (505 - 431.5)*k, ay = 911 + (858 - 911)*k;   // point du design placé au centre
    gl.uniform2f(uRes, canvas.width, canvas.height);
    gl.uniform1f(uScale, s*dpr);
    gl.uniform2f(uOffset, (W/2 - ax*s)*dpr, (H/2 - ay*s)*dpr);
    gl.uniform1f(uGlow, CFG.glow);
    gl.uniform1f(uBP, CFG.breathPeriod); gl.uniform1f(uBM, CFG.breathMin); gl.uniform1f(uCM, CFG.coreMin);
  }

  const still = reduceMotion || CFG.motion === 0;
  gl.uniform1f(uMotion, still ? 0 : CFG.motion);
  let running = true;
  function frame(ms){
    gl.uniform1f(uTime, still ? 0 : ms/1000*CFG.speed);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    if (running && !still) requestAnimationFrame(frame);
  }
  window.addEventListener('resize', () => { resize(); if (still) frame(0); });
  document.addEventListener('visibilitychange', () => {
    running = !document.hidden; if (running && !still) requestAnimationFrame(frame);
  });
  resize(); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
